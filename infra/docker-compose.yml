name: demanity

# Local development services only. Not for production.
# Ports bind to 127.0.0.1 so they are not exposed to your network.
#
# Two separate Postgres instances mirror the production privacy split
# (docs/PRIVACY.md): the identity vault and the activity database never
# share a server, database or credentials.
services:
  activity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: demanity_activity
      POSTGRES_USER: demanity
      POSTGRES_PASSWORD: ${ACTIVITY_DB_PASSWORD:-dev-only-activity}
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - activity-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U demanity -d demanity_activity']
      interval: 5s
      retries: 10

  vault-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: demanity_vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${VAULT_DB_PASSWORD:-dev-only-vault}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - vault-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vault -d demanity_vault']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  activity-data:
  vault-data:
